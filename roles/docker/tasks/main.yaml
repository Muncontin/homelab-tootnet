- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: "{{ docker_keyring_asc_path }}"
    mode: "0644"
    force: true

- name: De-armor Docker GPG key for APT
  ansible.builtin.command: gpg --dearmor --yes --output {{ docker_keyring_path }} {{ docker_keyring_asc_path }}
  args:
    creates: "{{ docker_keyring_path }}"

# Gets the UBUNTU CODENAME instead of the Linux Mint codename
- name: Get Ubuntu base codename
  ansible.builtin.shell: . /etc/os-release && echo "$UBUNTU_CODENAME"
  args:
    executable: /bin/bash
  register: ubuntu_codename_result
  changed_when: false

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_repo_url }}"
    suites: "{{ ubuntu_codename_result.stdout }}"
    components: stable
    signed_by: "{{ docker_keyring_path }}"

- name: Update apt and install Docker Engine
  ansible.builtin.apt:
    pkg: "{{ docker_packages }}"
    state: latest
    update_cache: true

- name: Create shared docker network
  community.docker.docker_network:
    name: shared
