- name: Create application directory
  ansible.builtin.file:
    path: /opt/containers/adguardhome
    state: directory
    mode: "0755" # Sets the permissions that the object should have

# AdGuardHome expects a bcrypt-encrypted password for authentication to its web ui
- name: Generate bcrypt hash matching AdGuard's expected format
  ansible.builtin.set_fact:
    adguard_admin_password_hash: "{{ adguardhome_password | password_hash('bcrypt', ident='2a') }}"
  no_log: true

- name: Copy docker-compose.yml to the server
  ansible.builtin.copy:
    src: ../files/docker-compose.yml
    dest: /opt/containers/adguardhome/docker-compose.yml
    mode: "0644"

- name: Copy the exported Adguard config with secrets injected (AdGuardHome.yaml) to the server
  ansible.builtin.template:
    src: ../templates/AdGuardHome.yaml.j2
    dest: /opt/containers/adguardhome/conf/AdGuardHome.yaml
    mode: "0644"
  no_log: true

- name: Deploy the Docker Compose application
  community.docker.docker_compose_v2:
    project_src: /opt/containers/adguardhome
    state: present
    recreate: always
  register: compose_result

- name: Show deployment status
  ansible.builtin.debug:
    msg: |
      Deployment complete.
      Containers: {{ compose_result.containers | length }}
