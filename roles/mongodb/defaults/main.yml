# roles/mongodb_install/defaults/main.yml

# Default settings for MongoDB installation
---
mongodb_version: "8.0" # Latest as of 09/2026
mongodb_port: 27017
mongodb_bind_ip: "127.0.0.1"
mongodb_dbpath: "/var/lib/mongodb"
mongodb_logpath: "/var/log/mongodb/mongod.log"
mongodb_service_name: "mongod"
mongodb_admin_user: "{{ lookup('community.general.bitwarden', 'mongodb-admin-homelab', field='username') | first }}"
mongodb_admin_password: "{{ lookup('community.general.bitwarden', 'mongodb-admin-homelab', field='password') | first }}"
mongodb_enable_auth: true
mongodb_wiredtiger_cache_size_gb: "1"
mongodb_apt_codename: "noble"
